<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Download Files</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .file {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .file h2 {
            margin-top: 0;
        }

        .download {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 7px;
        }

        .download:hover {
            background: #146c43;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>📁 Free Download Files</h1>
        <p>Download your favorite files easily</p>
    </header>

    <div class="container">

        <div class="file">
            <h2>Example File</h2>
            <p>Click the button below to download.</p>

            <a class="download" href="#" target="_blank">
                Download
            </a>
        </div>

    </div>

    <footer>
        © 2026 Free Download Files
    </footer>

</body>
</html>
