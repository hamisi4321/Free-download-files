<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Racing v0.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#183b18;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#228b22;
}

/* ROAD */
#road{
    position:absolute;
    left:15%;
    width:70%;
    height:100%;
    background:#303030;
    border-left:8px solid white;
    border-right:8px solid white;
    overflow:hidden;
}

/* ROAD LINES */
.line{
    position:absolute;
    width:7px;
    height:100px;
    background:white;
    left:33.33%;
}

.line2{
    position:absolute;
    width:7px;
    height:100px;
    background:white;
    left:66.66%;
}

/* TREES */
.tree{
    position:absolute;
    width:45px;
    height:45px;
    background:#075b12;
    border-radius:50%;
    z-index:1;
}

.tree:after{
    content:"";
    position:absolute;
    width:12px;
    height:35px;
    background:#704214;
    left:17px;
    top:35px;
}

/* CARS */
.car,
.enemy{
    position:absolute;
    width:58px;
    height:105px;
    border-radius:15px 15px 9px 9px;
    border:3px solid #111;
    box-shadow:0 4px 8px #111;
}

#player{
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(
        90deg,
        #a90000,
        #ff2020,
        #a90000
    );
    z-index:10;
}

.car:before,
.enemy:before{
    content:"";
    position:absolute;
    width:38px;
    height:38px;
    left:7px;
    top:15px;
    border-radius:8px;
    background:linear-gradient(#bdefff,#326c88);
    border:2px solid #111;
}

.light{
    position:absolute;
    width:12px;
    height:7px;
    background:#ff3333;
    bottom:8px;
    border-radius:3px;
}

.light.left{left:7px}
.light.right{right:7px}

/* HUD */
#distance{
    position:absolute;
    top:12px;
    left:12px;
    color:white;
    font-size:19px;
    font-weight:bold;
    z-index:30;
    text-shadow:2px 2px 3px #000;
}

#position{
    position:absolute;
    top:40px;
    left:12px;
    color:white;
    font-size:18px;
    font-weight:bold;
    z-index:30;
    text-shadow:2px 2px 3px #000;
}

/* POWER UPS */
#powers{
    position:absolute;
    right:8px;
    top:8px;
    z-index:40;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.power{
    width:115px;
    padding:10px 4px;
    border:2px solid white;
    border-radius:10px;
    color:white;
    font-weight:bold;
    font-size:15px;
}

#nitro{
    background:#e65c00;
}

#guard{
    background:#0066cc;
}

#weapon{
    background:#a00000;
}

/* FINISH */
#finishLine{
    position:absolute;
    left:15%;
    width:70%;
    height:75px;
    top:-100px;
    z-index:8;

    background:
    repeating-linear-gradient(
        45deg,
        white 0px,
        white 18px,
        black 18px,
        black 36px
    );

    border:4px solid white;

    display:flex;
    justify-content:center;
    align-items:center;

    color:red;
    font-size:23px;
    font-weight:bold;
}

/* COUNTDOWN */
#countdown{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:90px;
    font-weight:bold;
    z-index:100;
    text-shadow:4px 4px 8px black;
    background:rgba(0,0,0,.25);
}

/* RESULT */
#result{
    display:none;
    position:absolute;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.84);
    color:white;
    text-align:center;
    padding-top:28vh;
}

#result h1{
    font-size:46px;
    margin-bottom:15px;
}

#result p{
    font-size:22px;
}

#restart{
    margin-top:25px;
    padding:14px 30px;
    border:0;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

/* NITRO FIRE */
.fire{
    position:absolute;
    width:18px;
    height:38px;
    left:17px;
    top:100px;
    border-radius:50%;
    background:linear-gradient(
        white,
        yellow,
        orange,
        red
    );
    animation:fire .1s infinite alternate;
}

@keyframes fire{
    from{
        transform:scaleY(1);
    }
    to{
        transform:scaleY(1.5);
    }
}

/* GUARD */
.guarded{
    box-shadow:
        0 0 10px #00aaff,
        0 0 20px #00aaff,
        0 0 30px #00aaff !important;
}

/* BULLET */
.bullet{
    position:absolute;
    width:8px;
    height:22px;
    background:#ffff00;
    border-radius:5px;
    z-index:15;
}
</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div class="line" id="l1"></div>
        <div class="line" id="l2"></div>

        <div class="line2" id="r1"></div>
        <div class="line2" id="r2"></div>

    </div>

    <div class="tree" style="left:3%;top:100px"></div>
    <div class="tree" style="left:88%;top:220px"></div>
    <div class="tree" style="left:5%;top:500px"></div>
    <div class="tree" style="left:87%;top:650px"></div>

    <div id="finishLine">
        🏁 FINISH 🏁
    </div>

    <div id="distance">
        🏁 0 / 5000 m
    </div>

    <div id="position">
        🏆 4 / 4
    </div>

    <div id="powers">

        <button class="power" id="nitro">
            🚀 NITRO
        </button>

        <button class="power" id="guard">
            🛡️ GUARD
        </button>

        <button class="power" id="weapon">
            🔫 WEAPON
        </button>

    </div>

    <div id="player" class="car">

        <div class="light left"></div>
        <div class="light right"></div>

    </div>

    <div id="countdown">
        3
    </div>

    <div id="result">

        <h1 id="resultTitle">
            🏆 YOU WIN!
        </h1>

        <p id="resultText"></p>

        <button id="restart"
                onclick="location.reload()">
            🔄 RACE AGAIN
        </button>

    </div>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const player =
    document.getElementById("player");

const distanceText =
    document.getElementById("distance");

const positionText =
    document.getElementById("position");

const finishLine =
    document.getElementById("finishLine");

const countdown =
    document.getElementById("countdown");

const result =
    document.getElementById("result");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const nitroButton =
    document.getElementById("nitro");

const guardButton =
    document.getElementById("guard");

const weaponButton =
    document.getElementById("weapon");

const lines = [
    document.getElementById("l1"),
    document.getElementById("l2"),
    document.getElementById("r1"),
    document.getElementById("r2")
];


/* =========================
   GAME DATA
========================= */

const lanes = [25,50,75];

let playerLane = 1;

let distance = 0;

const finishDistance = 5000;

let speed = 5;

let running = false;

let nitro = false;

let guard = false;

let weapon = false;

let racers = [];

let roadOffset = 0;


/* =========================
   PLAYER
========================= */

function movePlayer(){

    player.style.left =
        lanes[playerLane] + "%";
}


/* =========================
   CREATE OPPONENTS
========================= */

function createOpponents(){

    const colors = [

        "linear-gradient(90deg,#0044aa,#0088ff,#0044aa)",

        "linear-gradient(90deg,#111,#555,#111)",

        "linear-gradient(90deg,#ff7b00,#ffc400,#ff7b00)"
    ];

    for(let i=0;i<3;i++){

        const car =
            document.createElement("div");

        car.className =
            "enemy";

        car.style.background =
            colors[i];

        car.style.left =
            lanes[i] + "%";

        car.style.top =
            (window.innerHeight -
             210 -
             i*15) + "px";

        car.dataset.distance =
            String(i * 80);

        car.dataset.speed =
            String(
                4.7 +
                Math.random()*0.8
            );

        game.appendChild(car);

        racers.push(car);
    }
}


/* =========================
   COUNTDOWN
========================= */

function countdownStart(){

    let n = 3;

    countdown.textContent =
        n;

    const timer =
        setInterval(()=>{

            n--;

            if(n > 0){

                countdown.textContent =
                    n;

            }else{

                countdown.textContent =
                    "GO!";

                setTimeout(()=>{

                    countdown.style.display =
                        "none";

                },500);

                running = true;

                createOpponents();

                requestAnimationFrame(
                    gameLoop
                );

                clearInterval(timer);
            }

        },1000);
}


/* =========================
   NITRO
========================= */

function useNitro(){

    if(!running || nitro)
        return;

    nitro = true;

    speed += 8;

    nitroButton.textContent =
        "🔥 BOOST!";

    const fire =
        document.createElement("div");

    fire.className =
        "fire";

    player.appendChild(fire);

    setTimeout(()=>{

        speed -= 8;

        nitro = false;

        fire.remove();

        nitroButton.textContent =
            "🚀 NITRO";

    },2000);
}


/* =========================
   GUARD
========================= */

function useGuard(){

    if(!running || guard)
        return;

    guard = true;

    player.classList.add(
        "guarded"
    );

    guardButton.textContent =
        "🛡️ ACTIVE";

    setTimeout(()=>{

        guard = false;

        player.classList.remove(
            "guarded"
        );

        guardButton.textContent =
            "🛡️ GUARD";

    },5000);
}


/* =========================
   WEAPON
========================= */

function useWeapon(){

    if(!running || weapon)
        return;

    weapon = true;

    weaponButton.textContent =
        "💥 FIRE!";

    const bullet =
        document.createElement("div");

    bullet.className =
        "bullet";

    bullet.style.left =
        (
            player.offsetLeft +
            25
        ) + "px";

    bullet.style.top =
        (
            player.offsetTop -
            20
        ) + "px";

    game.appendChild(bullet);

    let y =
        player.offsetTop - 20;

    const timer =
        setInterval(()=>{

            y -= 14;

            bullet.style.top =
                y + "px";

            racers.forEach(car=>{

                const b =
                    bullet.getBoundingClientRect();

                const c =
                    car.getBoundingClientRect();

                if(
                    b.left < c.right &&
                    b.right > c.left &&
                    b.top < c.bottom &&
                    b.bottom > c.top
                ){

                    let d =
                        Number(
                            car.dataset.distance
                        );

                    d -= 350;

                    if(d < 0)
                        d = 0;

                    car.dataset.distance =
                        d;

                    car.style.opacity =
                        "0.55";

                    setTimeout(()=>{

                        car.style.opacity =
                            "1";

                    },500);

                    bullet.remove();

                    clearInterval(timer);
                }

            });

            if(y < -50){

                bullet.remove();

                clearInterval(timer);
            }

        },30);

    setTimeout(()=>{

        weapon = false;

        weaponButton.textContent =
            "🔫 WEAPON";

    },1200);
}


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop(){

    if(!running)
        return;


    /* PLAYER MOVEMENT */

    distance += speed * 0.45;


    /* ROAD MOVEMENT */

    roadOffset += speed;

    if(roadOffset >= 110)
        roadOffset = 0;

    lines.forEach((line,index)=>{

        const offset =
            index % 2 === 0
            ? 0
            : -55;

        line.style.top =
            (roadOffset + offset) +
            "px";
    });


    /* FINISH MOVEMENT */

    const remaining =
        finishDistance -
        distance;

    const finishPosition =
        remaining * 0.16 -
        100;

    finishLine.style.top =
        finishPosition + "px";


    /* OPPONENT MOVEMENT */

    racers.forEach(car=>{

        let d =
            Number(
                car.dataset.distance
            );

        let s =
            Number(
                car.dataset.speed
            );

        d += s;

        car.dataset.distance =
            d;

        /*
        Relative position:
        opponent ahead = higher
        opponent behind = lower
        */

        const relative =
            d - distance;

        let y =
            470 -
            relative * 0.18;

        car.style.top =
            y + "px";
    });


    /* HUD */

    distanceText.textContent =
        "🏁 " +
        Math.floor(distance) +
        " / " +
        finishDistance +
        " m";


    /* POSITION */

    let place = 1;

    racers.forEach(car=>{

        if(
            Number(
                car.dataset.distance
            ) > distance
        ){

            place++;
        }
    });

    positionText.textContent =
        "🏆 " +
        place +
        " / 4";


    /* COLLISION */

    if(!guard){

        const p =
            player.getBoundingClientRect();

        racers.forEach(car=>{

            const c =
                car.getBoundingClientRect();

            if(
                p.left < c.right &&
                p.right > c.left &&
                p.top < c.bottom &&
                p.bottom > c.top
            ){

                crash();

            }
        });
    }


    /* FINISH */

    if(
        distance >=
        finishDistance
    ){

        finishRace();

        return;
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   CRASH
========================= */

function crash(){

    if(!running)
        return;

    running = false;

    result.style.display =
        "block";

    resultTitle.textContent =
        "💥 CRASH!";

    resultTitle.style.color =
        "#ff3333";

    resultText.textContent =
        "Umegonga gari la mpinzani!";
}


/* =========================
   FINISH
========================= */

function finishRace(){

    if(!running)
        return;

    running = false;

    let place = 1;

    racers.forEach(car=>{

        if(
            Number(
                car.dataset.distance
            ) > distance
        ){

            place++;
        }
    });

    result.style.display =
        "block";

    if(place === 1){

        resultTitle.textContent =
            "🏆 YOU WIN!";

        resultTitle.style.color =
            "#00ff55";

        resultText.textContent =
            "🔥 Umeshinda! Nafasi 1/4.";

    }else{

        resultTitle.textContent =
            "🏁 RACE FINISHED";

        resultTitle.style.color =
            "#ffd000";

        resultText.textContent =
            "Umemaliza nafasi " +
            place +
            "/4.";
    }
}


/* =========================
   TOUCH
========================= */

document.addEventListener(
    "touchstart",
    function(e){

        if(!running)
            return;

        if(
            e.target === nitroButton ||
            e.target === guardButton ||
            e.target === weaponButton
        ){

            return;
        }

        const x =
            e.touches[0].clientX;

        if(
            x <
            window.innerWidth / 2
        ){

            if(playerLane > 0)
                playerLane--;

        }else{

            if(playerLane < 2)
                playerLane++;
        }

        movePlayer();
    }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowLeft" &&
            playerLane > 0
        ){

            playerLane--;
        }

        if(
            e.key === "ArrowRight" &&
            playerLane < 2
        ){

            playerLane++;
        }

        if(
            e.code === "Space"
        ){

            useNitro();
        }

        movePlayer();
    }
);


/* =========================
   BUTTONS
========================= */

nitroButton.onclick =
    useNitro;

guardButton.onclick =
    useGuard;

weaponButton.onclick =
    useWeapon;


/* =========================
   START GAME
========================= */

movePlayer();

countdownStart();

</script>

</body>
</html>
