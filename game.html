<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Racing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#183b18;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#228b22;
}

/* ROAD */
#road{
    position:absolute;
    left:15%;
    width:70%;
    height:100%;
    background:#303030;
    border-left:8px solid #fff;
    border-right:8px solid #fff;
    overflow:hidden;
}

/* road lines */
.line{
    position:absolute;
    width:7px;
    height:100px;
    background:#fff;
    left:33.33%;
}

.line2{
    position:absolute;
    width:7px;
    height:100px;
    background:#fff;
    left:66.66%;
}

/* mazingira */
.tree{
    position:absolute;
    width:45px;
    height:45px;
    background:#075b12;
    border-radius:50%;
    z-index:1;
}

.tree:after{
    content:"";
    position:absolute;
    width:12px;
    height:35px;
    background:#704214;
    left:17px;
    top:35px;
}

/* PLAYER CAR */
.car{
    position:absolute;
    width:58px;
    height:105px;
    border-radius:15px 15px 9px 9px;
}

#player{
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(90deg,#a90000,#ff2020,#a90000);
    border:3px solid #111;
    z-index:10;
    box-shadow:0 4px 10px #111;
}

#player:before{
    content:"";
    position:absolute;
    width:38px;
    height:38px;
    left:7px;
    top:15px;
    border-radius:8px;
    background:linear-gradient(#bdefff,#326c88);
    border:2px solid #111;
}

.light{
    position:absolute;
    width:12px;
    height:7px;
    background:#ff3333;
    bottom:8px;
    border-radius:3px;
}

.light.left{left:7px}
.light.right{right:7px}

/* ENEMY */
.enemy{
    position:absolute;
    width:58px;
    height:105px;
    border-radius:15px 15px 9px 9px;
    border:3px solid #111;
    z-index:5;
    box-shadow:0 4px 8px #111;
}

.enemy:before{
    content:"";
    position:absolute;
    width:38px;
    height:38px;
    left:7px;
    top:15px;
    border-radius:8px;
    background:#bdefff;
    border:2px solid #111;
}

/* SCORE */
#score{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:22px;
    font-weight:bold;
    z-index:20;
    text-shadow:2px 2px 3px #000;
}

#speed{
    position:absolute;
    top:45px;
    left:15px;
    color:white;
    font-size:17px;
    z-index:20;
    text-shadow:2px 2px 3px #000;
}

/* GAME OVER */
#gameOver{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.78);
    color:white;
    z-index:50;
    text-align:center;
    padding-top:32vh;
}

#gameOver h1{
    font-size:42px;
    color:#ff3333;
    margin-bottom:10px;
}

#gameOver p{
    font-size:22px;
}

button{
    margin-top:25px;
    padding:14px 35px;
    border:0;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="road">
        <div class="line" id="l1"></div>
        <div class="line" id="l2"></div>
        <div class="line2" id="r1"></div>
        <div class="line2" id="r2"></div>
    </div>

    <div class="tree" style="left:3%;top:100px"></div>
    <div class="tree" style="left:88%;top:220px"></div>
    <div class="tree" style="left:5%;top:500px"></div>
    <div class="tree" style="left:87%;top:650px"></div>

    <div id="score">🏆 Score: 0</div>
    <div id="speed">⚡ Speed: 5</div>

    <div id="player" class="car">
        <div class="light left"></div>
        <div class="light right"></div>
    </div>

    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p id="finalScore"></p>
        <button onclick="location.reload()">🔄 RESTART</button>
    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const speedText = document.getElementById("speed");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

const lines = [
    document.getElementById("l1"),
    document.getElementById("l2"),
    document.getElementById("r1"),
    document.getElementById("r2")
];

let playerLane = 1;
let score = 0;
let speed = 5;
let running = true;

const lanes = [25,50,75];

function movePlayer(){

    player.style.left = lanes[playerLane] + "%";
}

function createEnemy(){

    if(!running) return;

    const enemy = document.createElement("div");
    enemy.className = "enemy";

    const colors = [
        "linear-gradient(90deg,#0044aa,#0088ff,#0044aa)",
        "linear-gradient(90deg,#111,#555,#111)",
        "linear-gradient(90deg,#ff7b00,#ffc400,#ff7b00)",
        "linear-gradient(90deg,#6512a8,#b83cff,#6512a8)"
    ];

    enemy.style.background =
        colors[Math.floor(Math.random()*colors.length)];

    const lane =
        Math.floor(Math.random()*lanes.length);

    enemy.style.left = lanes[lane] + "%";
    enemy.style.top = "-120px";

    game.appendChild(enemy);

    let y = -120;

    function move(){

        if(!running){
            enemy.remove();
            return;
        }

        y += speed;
        enemy.style.top = y + "px";

        const p = player.getBoundingClientRect();
        const e = enemy.getBoundingClientRect();

        if(
            p.left < e.right &&
            p.right > e.left &&
            p.top < e.bottom &&
            p.bottom > e.top
        ){
            running = false;
            gameOver.style.display = "block";
            finalScore.textContent =
                "🏆 Score yako: " + score;
            return;
        }

        if(y > window.innerHeight + 100){

            enemy.remove();

            score++;

            scoreText.textContent =
                "🏆 Score: " + score;

            if(score % 5 === 0){
                speed += 0.5;
                speedText.textContent =
                    "⚡ Speed: " + speed.toFixed(1);
            }

            return;
        }

        requestAnimationFrame(move);
    }

    requestAnimationFrame(move);
}

/* moving road */
let roadY = 0;

function animateRoad(){

    if(!running) return;

    roadY += speed;

    if(roadY > 110)
        roadY = 0;

    lines.forEach((line,index)=>{
        let offset = index % 2 === 0 ? 0 : -55;
        line.style.top = (roadY + offset) + "px";
    });

    requestAnimationFrame(animateRoad);
}

/* TOUCH CONTROLS */
document.addEventListener("touchstart",(e)=>{

    if(!running) return;

    const x = e.touches[0].clientX;

    if(x < window.innerWidth/2){

        if(playerLane > 0)
            playerLane--;

    }else{

        if(playerLane < 2)
            playerLane++;
    }

    movePlayer();
});

/* keyboard support */
document.addEventListener("keydown",(e)=>{

    if(e.key === "ArrowLeft" && playerLane > 0)
        playerLane--;

    if(e.key === "ArrowRight" && playerLane < 2)
        playerLane++;

    movePlayer();
});

setInterval(createEnemy,1300);

movePlayer();
animateRoad();

</script>

</body>
</html>
