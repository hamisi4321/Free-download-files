<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Racing v0.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#183b18;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#228b22;
}

/* ROAD */
#road{
    position:absolute;
    left:15%;
    width:70%;
    height:100%;
    background:#303030;
    border-left:8px solid white;
    border-right:8px solid white;
}

/* ROAD LINES */
.line{
    position:absolute;
    width:7px;
    height:100px;
    background:white;
    left:33.33%;
}

.line2{
    position:absolute;
    width:7px;
    height:100px;
    background:white;
    left:66.66%;
}

/* TREES */
.tree{
    position:absolute;
    width:45px;
    height:45px;
    background:#075b12;
    border-radius:50%;
    z-index:1;
}

.tree:after{
    content:"";
    position:absolute;
    width:12px;
    height:35px;
    background:#704214;
    left:17px;
    top:35px;
}

/* CARS */
.car,
.enemy{
    position:absolute;
    width:58px;
    height:105px;
    border-radius:15px 15px 9px 9px;
    border:3px solid #111;
    box-shadow:0 4px 8px #111;
}

#player{
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(
        90deg,
        #a90000,
        #ff2020,
        #a90000
    );
    z-index:10;
}

.car:before,
.enemy:before{
    content:"";
    position:absolute;
    width:38px;
    height:38px;
    left:7px;
    top:15px;
    border-radius:8px;
    background:linear-gradient(#bdefff,#326c88);
    border:2px solid #111;
}

.light{
    position:absolute;
    width:12px;
    height:7px;
    background:#ff3333;
    bottom:8px;
    border-radius:3px;
}

.light.left{left:7px}
.light.right{right:7px}

/* HUD */
#score{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:20px;
    font-weight:bold;
    z-index:30;
    text-shadow:2px 2px 3px #000;
}

#position{
    position:absolute;
    top:42px;
    left:15px;
    color:white;
    font-size:18px;
    font-weight:bold;
    z-index:30;
    text-shadow:2px 2px 3px #000;
}

/* POWER UPS */
#powers{
    position:absolute;
    right:10px;
    top:10px;
    z-index:40;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.power{
    width:115px;
    padding:10px 5px;
    border:2px solid white;
    border-radius:10px;
    color:white;
    font-weight:bold;
    font-size:15px;
    background:#222;
}

.power:active{
    transform:scale(.92);
}

#nitro{
    background:#e65c00;
}

#guard{
    background:#0066cc;
}

#weapon{
    background:#a00000;
}

/* FINISH */
#finishLine{
    position:absolute;
    top:-120px;
    left:15%;
    width:70%;
    height:80px;
    z-index:7;

    background:
    repeating-linear-gradient(
        45deg,
        white 0px,
        white 20px,
        black 20px,
        black 40px
    );

    border:4px solid white;

    display:flex;
    justify-content:center;
    align-items:center;

    color:red;
    font-size:25px;
    font-weight:bold;
}

/* COUNTDOWN */
#countdown{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:90px;
    font-weight:bold;
    z-index:100;
    text-shadow:4px 4px 8px black;
    background:rgba(0,0,0,.25);
}

/* GAME OVER / WIN */
#result{
    display:none;
    position:absolute;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center;
    padding-top:28vh;
}

#result h1{
    font-size:48px;
    margin-bottom:15px;
}

#result p{
    font-size:24px;
}

#restart{
    margin-top:25px;
    padding:14px 30px;
    border:0;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

/* NITRO FIRE */
.fire{
    position:absolute;
    width:18px;
    height:38px;
    left:17px;
    top:100px;
    border-radius:50%;
    background:linear-gradient(
        white,
        yellow,
        orange,
        red
    );
    animation:fire .1s infinite alternate;
}

@keyframes fire{
    from{
        transform:scaleY(1);
    }
    to{
        transform:scaleY(1.5);
    }
}

/* GUARD */
.guarded{
    box-shadow:
        0 0 10px #00aaff,
        0 0 20px #00aaff,
        0 0 30px #00aaff !important;
}

/* WEAPON */
.bullet{
    position:absolute;
    width:8px;
    height:22px;
    background:#ffff00;
    border-radius:5px;
    z-index:15;
}
</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div class="line" id="l1"></div>
        <div class="line" id="l2"></div>

        <div class="line2" id="r1"></div>
        <div class="line2" id="r2"></div>

    </div>

    <!-- TREES -->
    <div class="tree" style="left:3%;top:100px"></div>
    <div class="tree" style="left:88%;top:220px"></div>
    <div class="tree" style="left:5%;top:500px"></div>
    <div class="tree" style="left:87%;top:650px"></div>

    <!-- FINISH -->
    <div id="finishLine">
        🏁 FINISH 🏁
    </div>

    <!-- HUD -->
    <div id="score">
        🏁 Distance: 0
    </div>

    <div id="position">
        🏆 Position: 4/4
    </div>

    <!-- POWER UPS -->
    <div id="powers">

        <button class="power" id="nitro">
            🚀 NITRO
        </button>

        <button class="power" id="guard">
            🛡️ GUARD
        </button>

        <button class="power" id="weapon">
            🔫 WEAPON
        </button>

    </div>

    <!-- PLAYER -->
    <div id="player" class="car">

        <div class="light left"></div>
        <div class="light right"></div>

    </div>

    <!-- COUNTDOWN -->
    <div id="countdown">
        3
    </div>

    <!-- RESULT -->
    <div id="result">

        <h1 id="resultTitle">
            🏆 YOU WIN!
        </h1>

        <p id="resultText">
            Umeshinda race!
        </p>

        <button id="restart"
                onclick="location.reload()">
            🔄 RACE AGAIN
        </button>

    </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const positionText =
    document.getElementById("position");

const finishLine =
    document.getElementById("finishLine");

const countdown =
    document.getElementById("countdown");

const result =
    document.getElementById("result");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const nitroButton =
    document.getElementById("nitro");

const guardButton =
    document.getElementById("guard");

const weaponButton =
    document.getElementById("weapon");

const lines = [
    document.getElementById("l1"),
    document.getElementById("l2"),
    document.getElementById("r1"),
    document.getElementById("r2")
];

const lanes = [25,50,75];

let playerLane = 1;

let playerDistance = 0;

let raceDistance = 5000;

let speed = 5;

let running = false;

let nitroActive = false;

let guardActive = false;

let weaponActive = false;

let enemies = [];


/* =========================
   PLAYER
========================= */

function movePlayer(){

    player.style.left =
        lanes[playerLane] + "%";
}


/* =========================
   CREATE RACERS
========================= */

function createRacers(){

    const colors = [

        "linear-gradient(90deg,#0044aa,#0088ff,#0044aa)",

        "linear-gradient(90deg,#111,#555,#111)",

        "linear-gradient(90deg,#ff7b00,#ffc400,#ff7b00)"

    ];

    for(let i=0;i<3;i++){

        const enemy =
            document.createElement("div");

        enemy.className = "enemy";

        enemy.style.background =
            colors[i];

        enemy.style.left =
            lanes[i] + "%";

        enemy.style.top =
            (window.innerHeight - 170) + "px";

        enemy.dataset.distance = "0";

        game.appendChild(enemy);

        enemies.push(enemy);
    }
}


/* =========================
   COUNTDOWN
========================= */

function startCountdown(){

    let number = 3;

    countdown.textContent = number;

    const timer =
        setInterval(()=>{

            number--;

            if(number > 0){

                countdown.textContent =
                    number;

            }else{

                countdown.textContent =
                    "GO!";

                running = true;

                createRacers();

                setTimeout(()=>{

                    countdown.style.display =
                        "none";

                },600);

                clearInterval(timer);
            }

        },1000);
}


/* =========================
   NITRO
========================= */

function useNitro(){

    if(!running || nitroActive)
        return;

    nitroActive = true;

    speed += 8;

    nitroButton.textContent =
        "🔥 BOOST!";

    const fire =
        document.createElement("div");

    fire.className = "fire";

    player.appendChild(fire);

    setTimeout(()=>{

        speed -= 8;

        nitroActive = false;

        fire.remove();

        nitroButton.textContent =
            "🚀 NITRO";

    },2000);
}


/* =========================
   GUARD
========================= */

function useGuard(){

    if(!running || guardActive)
        return;

    guardActive = true;

    player.classList.add("guarded");

    guardButton.textContent =
        "🛡️ ACTIVE";

    setTimeout(()=>{

        guardActive = false;

        player.classList.remove(
            "guarded"
        );

        guardButton.textContent =
            "🛡️ GUARD";

    },5000);
}


/* =========================
   WEAPON
========================= */

function useWeapon(){

    if(!running || weaponActive)
        return;

    weaponActive = true;

    weaponButton.textContent =
        "💥 FIRE!";

    const bullet =
        document.createElement("div");

    bullet.className =
        "bullet";

    bullet.style.left =
        (player.offsetLeft + 25) + "px";

    bullet.style.top =
        (player.offsetTop - 20) + "px";

    game.appendChild(bullet);

    let y =
        player.offsetTop - 20;

    const moveBullet =
        setInterval(()=>{

            y -= 12;

            bullet.style.top =
                y + "px";

            enemies.forEach(enemy=>{

                const b =
                    bullet.getBoundingClientRect();

                const e =
                    enemy.getBoundingClientRect();

                if(
                    b.left < e.right &&
                    b.right > e.left &&
                    b.top < e.bottom &&
                    b.bottom > e.top
                ){

                    let d =
                        Number(
                            enemy.dataset.distance
                        );

                    d -= 300;

                    if(d < 0)
                        d = 0;

                    enemy.dataset.distance =
                        d;

                    enemy.style.transform =
                        "rotate(8deg)";

                    setTimeout(()=>{

                        enemy.style.transform =
                            "rotate(0deg)";

                    },300);

                    bullet.remove();

                    clearInterval(moveBullet);
                }

            });

            if(y < -50){

                bullet.remove();

                clearInterval(moveBullet);
            }

        },30);

    setTimeout(()=>{

        weaponActive = false;

        weaponButton.textContent =
            "🔫 WEAPON";

    },1000);
}


/* =========================
   RACE LOOP
========================= */

let roadY = 0;

function raceLoop(){

    if(!running)
        return;

    /* PLAYER SPEED */

    playerDistance += speed;

    if(playerDistance >
        raceDistance){

        playerDistance =
            raceDistance;

        finishRace();

        return;
    }


    /* ROAD */

    roadY += speed;

    if(roadY > 110)
        roadY = 0;

    lines.forEach((line,index)=>{

        let offset =
            index % 2 === 0
            ? 0
            : -55;

        line.style.top =
            (roadY + offset) + "px";
    });


    /* FINISH LINE */

    let finishProgress =
        raceDistance -
        playerDistance;

    let finishY =
        finishProgress * 0.12 -
        120;

    finishLine.style.top =
        finishY + "px";


    /* ENEMIES */

    enemies.forEach(enemy=>{

        let distance =
            Number(
                enemy.dataset.distance
            );

        distance +=
            speed *
            (0.85 +
            Math.random()*0.12);

        enemy.dataset.distance =
            distance;

        let relative =
            playerDistance -
            distance;

        let y =
            420 +
            relative * 0.12;

        enemy.style.top =
            y + "px";
    });


    /* SCORE */

    scoreText.textContent =
        "🏁 Distance: " +
        Math.floor(playerDistance)
        + " / " +
        raceDistance;


    /* POSITION */

    let position = 1;

    enemies.forEach(enemy=>{

        if(
            Number(enemy.dataset.distance)
            >
            playerDistance
        ){

            position++;
        }
    });

    positionText.textContent =
        "🏆 Position: " +
        position +
        "/4";


    /* COLLISION */

    if(!guardActive){

        const p =
            player.getBoundingClientRect();

        enemies.forEach(enemy=>{

            const e =
                enemy.getBoundingClientRect();

            if(
                p.left < e.right &&
                p.right > e.left &&
                p.top < e.bottom &&
                p.bottom > e.top
            ){

                loseRace();
            }

        });
    }

    requestAnimationFrame(
        raceLoop
    );
}


/* =========================
   FINISH
========================= */

function finishRace(){

    running = false;

    let position = 1;

    enemies.forEach(enemy=>{

        if(
            Number(enemy.dataset.distance)
            >
            playerDistance
        ){

            position++;
        }
    });

    result.style.display =
        "block";

    if(position === 1){

        resultTitle.textContent =
            "🏆 YOU WIN!";

        resultTitle.style.color =
            "#00ff55";

        resultText.textContent =
            "🔥 Umeshinda race! Ulikuwa wa 1/4.";

    }else{

        resultTitle.textContent =
            "🏁 RACE FINISHED";

        resultTitle.style.color =
            "#ffd000";

        resultText.textContent =
            "Umemaliza nafasi ya " +
            position +
            "/4.";
    }
}


/* =========================
   LOSE
========================= */

function loseRace(){

    if(!running)
        return;

    running = false;

    result.style.display =
        "block";

    resultTitle.textContent =
        "💥 CRASH!";

    resultTitle.style.color =
        "#ff3333";

    resultText.textContent =
        "Umegonga mpinzani!";
}


/* =========================
   CONTROLS
========================= */

document.addEventListener(
    "touchstart",
    (e)=>{

        if(!running)
            return;

        if(
            e.target === nitroButton ||
            e.target === guardButton ||
            e.target === weaponButton
        )
            return;

        const x =
            e.touches[0].clientX;

        if(
            x <
            window.innerWidth / 2
        ){

            if(playerLane > 0)
                playerLane--;

        }else{

            if(playerLane < 2)
                playerLane++;
        }

        movePlayer();
    }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    (e)=>{

        if(
            e.key === "ArrowLeft" &&
            playerLane > 0
        ){

            playerLane--;
        }

        if(
            e.key === "ArrowRight" &&
            playerLane < 2
        ){

            playerLane++;
        }

        if(e.code === "Space")
            useNitro();

        movePlayer();
    }
);


/* =========================
   POWER BUTTONS
========================= */

nitroButton.addEventListener(
    "click",
    useNitro
);

guardButton.addEventListener(
    "click",
    useGuard
);

weaponButton.addEventListener(
    "click",
    useWeapon
);


/* =========================
   START
========================= */

movePlayer();

startCountdown();

raceLoop();

</script>

</body>
</html>
